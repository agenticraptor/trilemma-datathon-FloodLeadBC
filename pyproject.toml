[project]
name = "floodlead"
version = "0.1.0"
description = "FloodLead BC: live archive and read API for BC and Nooksack river gauges"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[project.scripts]
floodlead = "floodlead.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodlead"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["evidence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (excluded by default; run with -m live)",
]
addopts = "-m 'not live'"
